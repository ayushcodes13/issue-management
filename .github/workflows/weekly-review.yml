name: Manual Weekly Linear Issue Review

on:
  # Manual only. Do not add a schedule here while the daily automation is focused
  # only on Granola Daily-Standup -> Linear suggestions -> Slack DMs.
  workflow_dispatch:
    inputs:
      post_to_slack:
        description: "Post the short summary to the configured Slack channel"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  weekly-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run Linear issue review
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_4_1_MODELS_ENDPOINT: "https://alerts-sweden-central.openai.azure.com/"
          AZURE_OPENAI_4_1_MODELS_VERSION: "2025-03-01-preview"
          AZURE_OPENAI_4_1_MODELS_DEPLOYMENT: "gpt-5.5"
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          AUDIT_MODE: "weekly"
          AUDIT_OUT_DIR: "results"
          WORKFLOW_POST_TO_SLACK: ${{ inputs.post_to_slack }}
        run: |
          python scripts/review.py
          if [ "${WORKFLOW_POST_TO_SLACK}" = "true" ] && [ -n "${SLACK_BOT_TOKEN}" ] && [ -n "${SLACK_CHANNEL_ID}" ]; then
            python scripts/post.py
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results
