name: Weekly Linear Issue Review

on:
  schedule:
    # Thursdays at 9:00 AM IST
    - cron: "30 3 * * 4"
  workflow_dispatch:
    inputs:
      post_to_slack:
        description: "Post the short summary to the configured Slack channel"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  weekly-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run Linear issue review
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_4_1_MODELS_ENDPOINT: "https://alerts-sweden-central.openai.azure.com/"
          AZURE_OPENAI_4_1_MODELS_VERSION: "2025-03-01-preview"
          AZURE_OPENAI_4_1_MODELS_DEPLOYMENT: "gpt-5.5"
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          AUDIT_MODE: "weekly"
          AUDIT_OUT_DIR: "results"
          WORKFLOW_POST_TO_SLACK: ${{ github.event_name == 'schedule' && vars.POST_WEEKLY_TO_SLACK || inputs.post_to_slack }}
        run: |
          python scripts/review.py
          if [ "${WORKFLOW_POST_TO_SLACK}" = "true" ] && [ -n "${SLACK_BOT_TOKEN}" ] && [ -n "${SLACK_CHANNEL_ID}" ]; then
            python scripts/post.py
          fi

      - name: Save latest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results state/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update weekly Linear results"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results
