name: Daily Standup Memory

on:
  schedule:
    # 10:30 IST, Monday-Friday. The runner waits for today's standup note to
    # appear, then sends only after the transcript has been stable for 15 min.
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Target standup date in YYYY-MM-DD, or today"
        required: false
        default: "today"
      send_slack_dms:
        description: "Send generated daily standup DM drafts to Slack"
        required: false
        default: "false"
      stable_seconds:
        description: "Transcript quiet period before processing. Use 0 for no-send smoke tests."
        required: false
        default: "900"
      min_transcript_chars:
        description: "Minimum transcript chars before processing"
        required: false
        default: "1000"
      max_wait_seconds:
        description: "Max wait for note/stability. Use 300 for smoke tests."
        required: false
        default: "14400"

permissions:
  contents: read

concurrency:
  group: daily-standup-memory
  cancel-in-progress: false

jobs:
  daily-standup-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight configuration
        env:
          GRANOLA_API_KEY: ${{ secrets.GRANOLA_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DAILY_STANDUP_DATE: ${{ inputs.date || 'today' }}
          DAILY_STANDUP_TIMEZONE: "Asia/Kolkata"
          DAILY_STANDUP_MAX_WAIT_SECONDS: ${{ inputs.max_wait_seconds || '14400' }}
          DAILY_STANDUP_POLL_SECONDS: "60"
          DAILY_STANDUP_STABLE_SECONDS: ${{ inputs.stable_seconds || '900' }}
          DAILY_STANDUP_MIN_TRANSCRIPT_CHARS: ${{ inputs.min_transcript_chars || '1000' }}
          DAILY_STANDUP_OUT_DIR: "results/daily-standup-memory"
          WORKFLOW_SEND_SLACK_DMS: ${{ (github.event_name == 'workflow_dispatch' && inputs.send_slack_dms == 'true') || vars.DAILY_STANDUP_SEND_SLACK_DMS == 'true' }}
        run: |
          set -euo pipefail

          echo "Daily Standup Memory preflight"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "date=${DAILY_STANDUP_DATE}"
          echo "timezone=${DAILY_STANDUP_TIMEZONE}"
          echo "poll_seconds=${DAILY_STANDUP_POLL_SECONDS}"
          echo "stable_seconds=${DAILY_STANDUP_STABLE_SECONDS}"
          echo "min_transcript_chars=${DAILY_STANDUP_MIN_TRANSCRIPT_CHARS}"
          echo "max_wait_seconds=${DAILY_STANDUP_MAX_WAIT_SECONDS}"
          echo "out_dir=${DAILY_STANDUP_OUT_DIR}"
          echo "send_slack_dms=${WORKFLOW_SEND_SLACK_DMS}"

          mkdir -p "${DAILY_STANDUP_OUT_DIR}"
          {
            echo "# Daily Standup Memory Run Status"
            echo
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Date: \`${DAILY_STANDUP_DATE}\`"
            echo "- Send Slack DMs: \`${WORKFLOW_SEND_SLACK_DMS}\`"
            echo "- Started: \`$(date -u +"%Y-%m-%dT%H:%M:%SZ")\`"
          } > "${DAILY_STANDUP_OUT_DIR}/run-status.md"

          missing=0
          for key in GRANOLA_API_KEY LINEAR_API_KEY AZURE_OPENAI_API_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required secret ${key}"
              missing=1
            else
              echo "${key}=set"
            fi
          done

          if [ "${WORKFLOW_SEND_SLACK_DMS}" = "true" ]; then
            if [ -z "${SLACK_BOT_TOKEN:-}" ]; then
              echo "::error::SLACK_BOT_TOKEN is required when Slack sending is enabled"
              missing=1
            else
              echo "SLACK_BOT_TOKEN=set"
            fi
          else
            echo "Slack sending disabled for this run."
          fi

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Granola metadata preflight
        env:
          GRANOLA_API_KEY: ${{ secrets.GRANOLA_API_KEY }}
          DAILY_STANDUP_DATE: ${{ inputs.date || 'today' }}
          DAILY_STANDUP_TIMEZONE: "Asia/Kolkata"
          DAILY_STANDUP_TITLE_REGEX: "^Daily[- ]Stand[- ]?up$|^Daily-Standup$"
          GRANOLA_PAGE_SIZE: "30"
          GRANOLA_MAX_PAGES: "10"
          GRANOLA_PREFLIGHT_DAYS: "3"
          GRANOLA_PREFLIGHT_LIMIT: "20"
        run: |
          set -euo pipefail
          python3 scripts/granola_preflight.py

      - name: Run today's Daily-Standup memory review
        timeout-minutes: 90
        env:
          GRANOLA_API_KEY: ${{ secrets.GRANOLA_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_4_1_MODELS_ENDPOINT: "https://alerts-sweden-central.openai.azure.com/"
          AZURE_OPENAI_4_1_MODELS_VERSION: "2025-03-01-preview"
          AZURE_OPENAI_4_1_MODELS_DEPLOYMENT: "gpt-5.5"
          DAILY_STANDUP_DATE: ${{ inputs.date || 'today' }}
          DAILY_STANDUP_TIMEZONE: "Asia/Kolkata"
          DAILY_STANDUP_MAX_WAIT_SECONDS: ${{ inputs.max_wait_seconds || '14400' }}
          DAILY_STANDUP_POLL_SECONDS: "60"
          DAILY_STANDUP_STABLE_SECONDS: ${{ inputs.stable_seconds || '900' }}
          DAILY_STANDUP_MIN_TRANSCRIPT_CHARS: ${{ inputs.min_transcript_chars || '1000' }}
          DAILY_STANDUP_OUT_DIR: "results/daily-standup-memory"
          GRANOLA_PAGE_SIZE: "30"
          GRANOLA_MAX_PAGES: "10"
        run: |
          set -euo pipefail
          ./run_daily_standup_memory.sh

      - name: Validate generated draft outputs
        env:
          DAILY_STANDUP_OUT_DIR: "results/daily-standup-memory"
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out_dir = Path(os.environ["DAILY_STANDUP_OUT_DIR"])
          required = [
              "summary.md",
              "report.md",
              "proposals.json",
              "raw-index.json",
              "dm-drafts.json",
          ]
          missing = [name for name in required if not (out_dir / name).exists()]
          if missing:
              raise SystemExit(f"Missing expected output files: {', '.join(missing)}")

          proposals_payload = json.loads((out_dir / "proposals.json").read_text())
          dm_drafts = json.loads((out_dir / "dm-drafts.json").read_text())
          counts = proposals_payload.get("counts") or {}
          token_usage = proposals_payload.get("tokenUsage") or {}
          provider_usage = token_usage.get("providerUsage") or {}

          print("Generated output validation")
          print(f"active_linear_issues={counts.get('linearIssuesReviewed')}")
          print(f"proposals={counts.get('proposals')}")
          print(f"dm_drafts={len(dm_drafts)}")
          print(f"analysis_source={proposals_payload.get('run', {}).get('source')}")
          if provider_usage:
              print(f"provider_total_tokens={provider_usage.get('total_tokens')}")

          if counts.get("linearIssuesReviewed", 0) <= 0:
              raise SystemExit("No Linear issues were reviewed.")
          if not isinstance(dm_drafts, list):
              raise SystemExit("dm-drafts.json is not a list.")
          PY

      - name: Validate Slack recipients before sending
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.send_slack_dms == 'true') || vars.DAILY_STANDUP_SEND_SLACK_DMS == 'true' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DAILY_STANDUP_OUT_DIR: "results/daily-standup-memory"
        run: ./send_daily_standup_dms.sh --validate-users

      - name: Optionally send Daily-Standup Slack DMs
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.send_slack_dms == 'true') || vars.DAILY_STANDUP_SEND_SLACK_DMS == 'true' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DAILY_STANDUP_OUT_DIR: "results/daily-standup-memory"
        run: ./send_daily_standup_dms.sh --send --yes

      - name: Write workflow summary
        if: always()
        env:
          DAILY_STANDUP_OUT_DIR: "results/daily-standup-memory"
          WORKFLOW_SEND_SLACK_DMS: ${{ (github.event_name == 'workflow_dispatch' && inputs.send_slack_dms == 'true') || vars.DAILY_STANDUP_SEND_SLACK_DMS == 'true' }}
        run: |
          set -euo pipefail
          {
            echo "## Daily Standup Memory"
            echo
            echo "- Send Slack DMs: \`${WORKFLOW_SEND_SLACK_DMS}\`"
            echo "- Output dir: \`${DAILY_STANDUP_OUT_DIR}\`"
            echo
            if [ -f "${DAILY_STANDUP_OUT_DIR}/summary.md" ]; then
              cat "${DAILY_STANDUP_OUT_DIR}/summary.md"
            else
              echo "No summary file was generated."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-standup-memory
          path: results/daily-standup-memory
          if-no-files-found: warn
